
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Messenger</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="chat-container">
        <header>
            <h1>LAN Messenger</h1>
            <p>پیام‌رسان شبکه داخلی</p>
        </header>

        <section class="login">
            <label for="username">نام کاربری</label>
            <input id="username" maxlength="30" placeholder="نام کاربری...">
            <input id="password" type="password" minlength="8" placeholder="Password">
            <button id="connectButton">اتصال به چت</button>
            <p id="status">هنوز متصل نشده‌ای.</p>
        </section>

        <section id="messages" class="messages"></section>

        <form id="chatForm" class="message-form">
            <input
                id="messageInput"
                maxlength="1000"
                placeholder="پیامت را بنویس..."
                autocomplete="off"
                disabled
            >
            <button id="sendButton" disabled>ارسال</button>
        </form>
    </main>

    <script>
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password")
        const connectButton = document.getElementById("connectButton");
        const statusText = document.getElementById("status");
        const messages = document.getElementById("messages");
        const chatForm = document.getElementById("chatForm");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");

        let socket = null;

        connectButton.addEventListener("click", () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim()


            if (!username) {
                statusText.textContent = "ابتدا نام کاربری را وارد کن.";
                return;
            }
            if (!password){
                statusText.textContent = "Enter pass";
                return;
            }
            if (socket && socket.readyState !== WebSocket.CLOSED) {
                statusText.textContent = "اتصال قبلی هنوز برقرار است.";
                return;
            }

            const protocol =
                window.location.protocol === "https:" ? "wss:" : "ws:";

            socket = new WebSocket(
                `${protocol}//${window.location.host}/ws`
            );


socket.addEventListener("open", () => {
    socket.send(JSON.stringify({
        username: username,
        password: password
    }));

    statusText.textContent = "در حال بررسی رمز عبور...";

    usernameInput.disabled = true;
    passwordInput.disabled = true;
    connectButton.disabled = true;
});

            socket.addEventListener("message", (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "login_success") {
                    statusText.textContent = "ورود موفق بود.";
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    messageInput.focus();
                    return;
}
                const item = document.createElement("div");
                item.className = "message";

                const sender = document.createElement("strong");
                sender.textContent = data.username + ": ";

                const content = document.createElement("span");
                content.textContent = data.message;

                item.append(sender, content);
                messages.appendChild(item);
                messages.scrollTop = messages.scrollHeight;
            });

            socket.addEventListener("close", () => {
                statusText.textContent = "اتصال قطع شد.";
                usernameInput.disabled = false;
                passwordInput.disabled = false;
                connectButton.disabled = false;
                messageInput.disabled = true;
                sendButton.disabled = true;
            });

            socket.addEventListener("error", () => {
                statusText.textContent = "خطا در ارتباط با سرور.";
            });
        });

        chatForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const message = messageInput.value.trim();

            if (!socket || socket.readyState !== WebSocket.OPEN) {
                statusText.textContent = "ابتدا به سرور متصل شو.";
                return;
            }

            if (!message) return;

            socket.send(JSON.stringify({ message }));
            messageInput.value = "";
            messageInput.focus();
        });
    </script>
</body>
</html>
