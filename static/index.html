
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Messenger</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <main class="chat-container">
        <header>
            <h1>LAN Messenger</h1>
            <p>پیام‌رسان شبکه داخلی</p>
        </header>

        <section class="chat-status">
            <p id="status">در حال اتصال به سرور...</p>
            <a href="/logout">خروج از حساب</a>
        </section>

        <section id="messages" class="messages"></section>

        <form id="chatForm" class="message-form">
            <input
                id="messageInput"
                type="text"
                maxlength="1000"
                placeholder="پیامت را بنویس..."
                autocomplete="off"
                disabled
                required
            >
            <button id="sendButton" type="submit" disabled>
                ارسال
            </button>
        </form>
    </main>
</body>
</html>
