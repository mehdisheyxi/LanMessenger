
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Messenger</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <main class="chat-container">
        <header>
            <h1>LAN Messenger</h1>
            <p>پیام‌رسان شبکه داخلی</p>
        </header>

        <section class="login">
            <label for="username">نام کاربری</label>
            <input id="username" maxlength="30" placeholder="نام کاربری...">
            <input id="password" type="password" minlength="8" placeholder="Password">
            <button id="connectButton">اتصال به چت</button>
            <p id="status">هنوز متصل نشده‌ای.</p>
        </section>

        <section id="messages" class="messages"></section>

        <form id="chatForm" class="message-form">
            <input
                id="messageInput"
                maxlength="1000"
                placeholder="پیامت را بنویس..."
                autocomplete="off"
                disabled
            >
            <button id="sendButton" disabled>ارسال</button>
        </form>
    </main>


</body>
</html>
